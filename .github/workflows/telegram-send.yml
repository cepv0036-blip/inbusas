# Actions → este workflow → Run workflow (texto) → Telegram.
# Secretos: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: Telegram send

on:
  workflow_dispatch:
    inputs:
      text:
        description: Texto a enviar al chat configurado
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que corre el script del repo
        run: |
          set -e
          if [ ! -f .github/scripts/telegram_send.py ]; then
            echo "::error::No está .github/scripts/telegram_send.py. Hacé git pull y git push desde tu PC en la rama default del repo."
            exit 1
          fi
          echo "::notice::OK: se usará .github/scripts/telegram_send.py (si el error dice stdin, estás viendo una corrida vieja o otro repo)."

      - name: Enviar mensaje por Bot API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: ${{ github.event.inputs.text }}
        run: |
          set -e
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::Definí los secretos TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID."
            exit 1
          fi
          python3 .github/scripts/telegram_send.py
